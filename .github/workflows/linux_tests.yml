name: zzz [DO NOT RUN] Unit tests on Linux

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Any PR that touches code this job compiles, whatever branch it targets.
  pull_request:
    paths:
      # AlgorithmPackage/Sources is a symlink, so the real directories the
      # manifest compiles have to be listed too.
      - 'AlgorithmPackage/**'
      - 'Trio/Sources/APS/OpenAPSSwift/**'
      - 'Trio/Sources/APS/Extensions/DecimalExtensions.swift'
      - 'Trio/Sources/Models/**'
      - 'Trio/Sources/Helpers/**'
      - 'Trio/Sources/Services/Alerts/**'
      - 'Trio/Sources/Services/Network/**'
      - 'Trio/Sources/Modules/Home/View/MultiUsePanelState.swift'
      - 'TrioTests/**'
      - '.github/workflows/linux_tests.yml'
  push:
    branches:
      - main
      - dev
    paths:
      # AlgorithmPackage/Sources is a symlink, so the real directories the
      # manifest compiles have to be listed too.
      - 'AlgorithmPackage/**'
      - 'Trio/Sources/APS/OpenAPSSwift/**'
      - 'Trio/Sources/APS/Extensions/DecimalExtensions.swift'
      - 'Trio/Sources/Models/**'
      - 'Trio/Sources/Helpers/**'
      - 'Trio/Sources/Services/Alerts/**'
      - 'Trio/Sources/Services/Network/**'
      - 'Trio/Sources/Modules/Home/View/MultiUsePanelState.swift'
      - 'TrioTests/**'
      - '.github/workflows/linux_tests.yml'

jobs:
  linux-tests:
    name: Unit tests (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:6.1.2-noble
    timeout-minutes: 20
    if: github.repository_owner == 'nightscout'

    env:
      # The golden parity suite self-skips unless the process runs in the zone
      # the goldens were recorded in (ParityEnv.timeZoneIdentifier).
      TZ: Europe/Berlin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The package has no dependencies outside Trio/Sources.
          submodules: false

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: |
          set -o pipefail
          swift test --package-path AlgorithmPackage 2>&1 | tee swift-test.log

      # `swift test` exits 0 if the suite stops being discovered, and the test
      # count is the same whether the parity suite runs or skips.
      - name: Check that tests actually ran
        run: |
          set -euo pipefail
          COUNT="$(grep -oE 'Test run with [0-9]+ tests' swift-test.log \
                   | grep -oE '[0-9]+' | sort -rn | head -1 || true)"
          if [[ -z "${COUNT}" || "${COUNT}" -lt 270 ]]; then
            echo "::error title=Unit tests (Linux)::Expected 270+ tests, found: ${COUNT:-none}"
            exit 1
          fi
          if grep -q 'golden parity" skipped' swift-test.log; then
            echo "::error title=Unit tests (Linux)::Golden parity suite skipped; TZ pinning did not take effect"
            exit 1
          fi
          echo "Linux unit tests: ${COUNT} tests executed (TZ=${TZ})." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-log
          path: swift-test.log
